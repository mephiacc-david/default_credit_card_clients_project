name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download data
        run: python -m src.data.download
      - name: Validate data with Pandera
        run: python -m src.data.validation
      - name: Validate data with Great Expectations
        run: python -m src.data.validation_gx
      - name: Unit tests
        run: pytest -q
      - name: Check formatting
        run: black --check src tests
      - name: Lint
        run: flake8 src tests
